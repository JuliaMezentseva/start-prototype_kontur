<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Вакансии — Skillaz Start</title>
<link rel="stylesheet" href="../assets/styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../assets/ds_bundle.js"></script>
<script src="../assets/data.js"></script>
<script type="text/babel" src="../assets/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Card, Tag, Input, Select, Button, Checkbox, Tabs, Divider, Switch, Snackbar } = window.SkillazCoreDesignSystem_bf9566;
const { AppShell, Icons } = window.Site;
const { IconSearch, IconX, IconSparklesSolid } = Icons;
const D = window.SITE_DATA;

// Переключатель "Витрина / Мои отклики" — это переход между двумя разными HTML-страницами
// (как VacanciesModeTabs у HR в hr/vacancies.html), поэтому onChange просто меняет location,
// а не переключает состояние на одной странице.
function EmployeeVacanciesTabs({ active, responsesCount }) {
  function go(id) {
    if (id === active) return;
    window.location.href = id === "showcase" ? "vacancies.html" : "my-responses.html";
  }
  return (
    <Tabs active={active} onChange={go} items={[
      { id: "showcase", label: "Вакансии" },
      { id: "my-responses", label: "Мои отклики", count: responsesCount || undefined },
    ]} />
  );
}

// Локальные иконки в стилистике общего набора (mkIcon: viewBox 24, strokeWidth 1.5, currentColor).
function IconThumbUp({ size = 24, color = "currentColor", style }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" style={{ color, flexShrink: 0, ...style }}>
      <path d="M8 11v7a1 1 0 0 0 1 1h6.2a2 2 0 0 0 1.96-1.6l1-5a2 2 0 0 0-1.96-2.4H13l.5-3.2a1.6 1.6 0 0 0-3.1-.6L9 11H8Z"
        stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
      <path d="M8 11H6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2"
        stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function IconBell({ size = 24, color = "currentColor", style }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" style={{ color, flexShrink: 0, ...style }}>
      <path d="M12 4a6 6 0 0 0-6 6v3.2l-1.4 2.4a.8.8 0 0 0 .7 1.2h13.4a.8.8 0 0 0 .7-1.2L18 13.2V10a6 6 0 0 0-6-6Z"
        stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" />
      <path d="M10 19.5a2 2 0 0 0 4 0" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" />
    </svg>
  );
}

function fmtMoney(n) { return n.toLocaleString("ru-RU"); }
function toOptions(list) { return list.map((v) => ({ value: v, label: v })); }

const emptyFilters = { directions: [], positions: [], departments: [], experience: [], cities: [], formats: [], employments: [], transitionTypes: [] };

// Подпись бирки подписки в духе "Регион: Москва, Пермь +2" — короткая, без перечисления
// всех значений сразу, чтобы бирка не растягивалась на всю ширину при большом наборе фильтров.
const FILTER_LABELS = { directions: "Направление", positions: "Должность", departments: "Подразделение", experience: "Опыт", cities: "Регион", formats: "Формат", employments: "Занятость", transitionTypes: "Тип перехода" };
function summarizeFilters(filters) {
  return Object.keys(FILTER_LABELS)
    .filter((k) => filters[k].length)
    .map((k) => `${FILTER_LABELS[k]}: ${filters[k].slice(0, 2).join(", ")}${filters[k].length > 2 ? ` +${filters[k].length - 2}` : ""}`)
    .join(" · ");
}
// Сравнение по набору значений, а не по ссылке/порядку — один и тот же выбор фильтров,
// собранный в разное время, должен давать одну подпись независимо от порядка выбора.
function filtersSignature(filters) {
  return JSON.stringify(Object.keys(FILTER_LABELS).map((k) => [...filters[k]].sort()));
}

// Панель подписки на уведомления по текущим фильтрам: тогл сохраняет снимок filters
// как отдельную подписку (в духе job alert на hh.ru/LinkedIn) — если подписок несколько,
// они показаны бирками под тоглом, каждую можно снять по отдельности.
function SubscribeBar({ filters, hasActiveFilters, subscriptions, onSubscribe, onUnsubscribe }) {
  const sig = filtersSignature(filters);
  const isOn = hasActiveFilters && subscriptions.some((s) => s.sig === sig);
  return (
    <div className="sk-col sk-gap-2">
      <div className="sk-row sk-gap-3" style={{
        alignItems: "center", padding: "10px 14px", borderRadius: "var(--sk-radius-2)",
        border: "1px solid var(--sk-stroke)", background: "var(--sk-surface-secondary)",
      }}>
        <IconBell size={18} color="var(--sk-icon-secondary)" />
        <div className="sk-col" style={{ flex: 1, gap: 2 }}>
          <div className="sk-label-3-regular">Уведомлять о новых вакансиях по этим фильтрам</div>
          {!hasActiveFilters && (
            <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>Выберите хотя бы один фильтр, чтобы подписаться</div>
          )}
        </div>
        <Switch checked={isOn} disabled={!hasActiveFilters} onChange={(v) => (v ? onSubscribe(sig, filters) : onUnsubscribe(sig))} />
      </div>
      {subscriptions.length > 0 && (
        <div className="sk-row sk-gap-2" style={{ flexWrap: "wrap" }}>
          {subscriptions.map((s) => (
            <span key={s.sig} className="sk-row sk-gap-1" style={{
              alignItems: "center", padding: "5px 6px 5px 10px", borderRadius: "var(--sk-radius-full)",
              border: "1px solid var(--sk-stroke)", font: "var(--sk-label-4-regular)", color: "var(--sk-text-secondary)",
            }}>
              <IconBell size={12} />{s.summary || "Все вакансии"}
              <span onClick={() => onUnsubscribe(s.sig)} className="sk-clickable" style={{ display: "inline-flex", opacity: 0.55, padding: 2 }}>
                <IconX size={12} />
              </span>
            </span>
          ))}
        </div>
      )}
    </div>
  );
}

// Демо-значения ИИ-оценки соответствия для витрины — пока подбор считает не для всех
// вакансий сразу, а только по запросу ("Вакансии для меня"), поэтому здесь фиксированные
// проценты для пары карточек, чтобы показать сам вид индикатора.
const DEMO_MATCH = { v1: 95, v2: 80 };

// Компактный фильтр с небольшим числом вариантов (Опыт, Регион, Формат работы,
// Тип занятости, Тип перехода) — обычный мультиселект-дропдаун, значения видны сразу
// (заголовок + закрытый контрол), без отдельного шага "раскрыть раздел".
function FilterSelect({ label, options, value, onChange }) {
  return <Select label={label} multiple options={options} value={value} onChange={onChange} placeholder="Все варианты" />;
}

// Фильтр с потенциально длинным списком вариантов (Направление, Должность, Подразделение) —
// поиск и список чекбоксов видны сразу, без раскрытия по клику: набор значений может быть
// большим, поэтому сразу нужен способ его сузить.
function FilterSearchList({ label, options, value, onChange }) {
  const [q, setQ] = React.useState("");
  const needle = q.trim().toLowerCase();
  const shown = needle ? options.filter((o) => o.label.toLowerCase().includes(needle)) : options;
  function toggle(v) { onChange(value.includes(v) ? value.filter((x) => x !== v) : [...value, v]); }
  return (
    <div className="sk-col sk-gap-2">
      <span style={{ font: value.length ? "var(--sk-label-3)" : "var(--sk-label-3-regular)", color: "var(--sk-text-primary)" }}>
        {label}{value.length ? " · " + value.length : ""}
      </span>
      <Input size="s" icon={<IconSearch size={16} />} placeholder="Поиск" value={q} onChange={(e) => setQ(e.target.value || "")} />
      <div className="sk-col" style={{ maxHeight: 160, overflowY: "auto" }}>
        {shown.length ? shown.map((o) => (
          <label key={o.value} className="sk-row sk-gap-2" style={{ padding: "5px 2px", cursor: "pointer", alignItems: "center" }}>
            <Checkbox checked={value.includes(o.value)} onChange={() => toggle(o.value)} />
            <span className="sk-label-4-regular">{o.label}</span>
          </label>
        )) : (
          <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)", padding: "5px 2px" }}>Ничего не найдено</div>
        )}
      </div>
    </div>
  );
}

// Боковая панель фильтров — справа от списка вакансий (там же, где раньше жила панель
// направлений); "Направление" стало первым фильтром в общем списке, а не отдельным блоком.
function FiltersPanel({ filters, onChange, hasActiveFilters, onReset, directionOptions, positionOptions, departmentOptions, subscriptions, onSubscribe, onUnsubscribe }) {
  const set = (key) => (v) => onChange((f) => ({ ...f, [key]: v }));
  return (
    <Card bordered style={{ width: 280, flexShrink: 0, padding: 16 }}>
      <div className="sk-col sk-gap-4">
        <div className="sk-row" style={{ justifyContent: "space-between", alignItems: "center" }}>
          <div className="sk-label-2">Фильтры</div>
          {hasActiveFilters && (
            <button type="button" className="sk-link-btn sk-label-4-regular" onClick={onReset}>Сбросить</button>
          )}
        </div>
        <FilterSearchList label="Направление" options={directionOptions} value={filters.directions} onChange={set("directions")} />
        <Divider />
        <FilterSearchList label="Должность" options={positionOptions} value={filters.positions} onChange={set("positions")} />
        <Divider />
        <FilterSearchList label="Подразделение" options={departmentOptions} value={filters.departments} onChange={set("departments")} />
        <Divider />
        <FilterSelect label="Опыт" options={toOptions(D.experienceOptions)} value={filters.experience} onChange={set("experience")} />
        <FilterSelect label="Регион" options={toOptions(D.cities)} value={filters.cities} onChange={set("cities")} />
        <FilterSelect label="Формат работы" options={toOptions(D.workFormats)} value={filters.formats} onChange={set("formats")} />
        <FilterSelect label="Тип занятости" options={toOptions(D.employmentTypes)} value={filters.employments} onChange={set("employments")} />
        <FilterSelect label="Тип перехода" options={toOptions(D.transitionTypes)} value={filters.transitionTypes} onChange={set("transitionTypes")} />
        <Divider />
        <SubscribeBar filters={filters} hasActiveFilters={hasActiveFilters} subscriptions={subscriptions}
          onSubscribe={onSubscribe} onUnsubscribe={onUnsubscribe} />
      </div>
    </Card>
  );
}

// matchPercent — демо-данные ИИ-оценки соответствия профилю сотрудника (см. computeMatchScore
// ниже в shell.js); показывается тегом "Подходит на N%" в общем ряду с типом перехода.
function VacancyCard({ vacancy, hasResponse, matchPercent }) {
  const closed = vacancy.status === "closed";
  const dim = hasResponse ? 0.55 : 1;
  const [hovered, setHovered] = React.useState(false);
  return (
    <a href={"vacancy.html?id=" + vacancy.id} style={{ textDecoration: "none" }}
      onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)}>
      <Card bordered
        style={{
          cursor: "pointer", height: "100%",
          boxShadow: hovered ? "inset 0 0 0 1.5px var(--sk-stroke-accent)" : "inset 0 0 0 1px var(--sk-stroke)",
        }}>
        <div className="sk-col sk-gap-2" style={{ height: "100%" }}>
          <div className="sk-row" style={{ justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
            <div className="sk-label-3" style={{ opacity: dim }}>{vacancy.title}</div>
            {hasResponse
              ? <Tag size="s" hue="positive" icon={<IconThumbUp size={13} />}>Уже откликнулись</Tag>
              : closed
                ? <Tag size="s" hue="neutral">Закрыта</Tag>
                : (vacancy.isNew && <Tag size="s" style={{ background: "var(--sk-accent)", color: "var(--sk-text-contrast)" }}>Новая</Tag>)}
          </div>

          <div className="sk-label-3-regular" style={{ opacity: dim }}>
            {vacancy.salaryFrom && vacancy.salaryTo ? `${fmtMoney(vacancy.salaryFrom)} – ${fmtMoney(vacancy.salaryTo)} ₽` : "По договорённости"}
          </div>

          <div className="sk-row sk-gap-2" style={{ flexWrap: "wrap", opacity: dim }}>
            {matchPercent != null && (
              <Tag size="s" pill icon={<IconSparklesSolid size={12} />} style={{ background: "var(--sk-special-secondary)", color: "rgb(117,59,233)" }}>
                Подходит на {Math.round(matchPercent)}%
              </Tag>
            )}
            <Tag size="s" hue="gray" pill>{vacancy.transitionType}</Tag>
          </div>

          <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)", opacity: dim }}>
            {vacancy.city} · {vacancy.department}
          </div>
        </div>
      </Card>
    </a>
  );
}

function Page() {
  // Сотрудник видит только опубликованные HR-ом вакансии (visibleToEmployees) — вручную
  // созданные и ещё не опубликованные HR-ом вакансии на витрине не показываются, ровно
  // как задумано в разделе HR "Вакансии" (переключатель "Опубликована / Скрыта").
  const visibleVacancies = React.useMemo(() => D.vacancies.filter((v) => v.visibleToEmployees !== false), []);
  const responses = D.myResponses;
  const respondedIds = React.useMemo(() => new Set(responses.map((r) => r.vacancyId)), [responses]);

  const [q, setQ] = React.useState("");
  const [filters, setFilters] = React.useState(emptyFilters);
  const [subscriptions, setSubscriptions] = React.useState([]);
  const [toast, setToast] = React.useState(null);
  function showToast(msg) { setToast(msg); window.setTimeout(() => setToast(null), 3200); }
  function subscribe(sig, f) {
    setSubscriptions((subs) => [...subs.filter((s) => s.sig !== sig), { sig, summary: summarizeFilters(f) }]);
    showToast("Готово! Пришлём уведомление на почту и в личный кабинет, как только появится подходящая вакансия.");
  }
  function unsubscribe(sig) {
    setSubscriptions((subs) => subs.filter((s) => s.sig !== sig));
    showToast("Подписка отключена.");
  }

  // "Моё подразделение" / "Моя должность" закреплены первым пунктом списка — значение
  // совпадает с реальным department/title вакансии, поэтому фильтрация ниже не требует
  // особого случая для этого пункта, а сам пункт исключается из общего алфавитного списка,
  // чтобы не дублироваться.
  const departmentOptions = React.useMemo(() => {
    const rest = [...new Set(visibleVacancies.map((v) => v.department))].filter((d) => d !== D.person.department).sort();
    return [{ value: D.person.department, label: "Моё подразделение" }, ...toOptions(rest)];
  }, [visibleVacancies]);
  const positionOptions = React.useMemo(() => {
    const rest = [...new Set(visibleVacancies.map((v) => v.title))].filter((t) => t !== D.person.position).sort();
    return [{ value: D.person.position, label: "Моя должность" }, ...toOptions(rest)];
  }, [visibleVacancies]);

  const needle = q.trim().toLowerCase();
  const filtered = visibleVacancies.filter((v) => {
    if (v.status === "closed") return false;
    if (filters.directions.length && !filters.directions.includes(v.direction)) return false;
    if (filters.positions.length && !filters.positions.includes(v.title)) return false;
    if (filters.departments.length && !filters.departments.includes(v.department)) return false;
    if (filters.experience.length && !filters.experience.includes(v.experience)) return false;
    if (filters.cities.length && !filters.cities.includes(v.city)) return false;
    if (filters.formats.length && !filters.formats.includes(v.format)) return false;
    if (filters.employments.length && !filters.employments.includes(v.employment)) return false;
    if (filters.transitionTypes.length && !filters.transitionTypes.includes(v.transitionType)) return false;
    if (needle && !v.title.toLowerCase().includes(needle) && !v.department.toLowerCase().includes(needle)) return false;
    return true;
  });

  const activeFilterCount = filters.directions.length + filters.positions.length + filters.departments.length + filters.experience.length
    + filters.cities.length + filters.formats.length + filters.employments.length + filters.transitionTypes.length;
  const hasActiveFilters = activeFilterCount > 0;

  return (
    <AppShell role="employee" active="vacancies" base="..">
      <div className="sk-title-4">Откройте новые карьерные возможности</div>
      <EmployeeVacanciesTabs active="showcase" responsesCount={responses.length} />

      <div className="sk-col sk-gap-3">
        <div className="sk-row sk-gap-2" style={{ alignItems: "center", flexWrap: "wrap" }}>
          <Input size="s" icon={<IconSearch size={20} />} placeholder="По названию, должности или подразделению"
            value={q} onChange={(e) => setQ(e.target.value || "")} style={{ width: 460, flexShrink: 0 }} />
          {/* Поиск с AI: открывает общий дровер-помощник (см. AiAssistantWidget в assets/shell.js)
              и сразу прогоняет запрос подбора, чтобы список подходящих вакансий появился без
              дополнительного клика по чипу внутри чата. */}
          <Button style={{ background: "var(--sk-special-secondary)", color: "rgb(117,59,233)", fontWeight: 500 }} icon={<IconSparklesSolid size={16} />}
            onClick={() => window.__skAiOpenAssistant && window.__skAiOpenAssistant("Подходящие мне вакансии")}>
            Вакансии для меня
          </Button>
        </div>

        <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>Найдено вакансий: {filtered.length}</div>

        <div className="sk-row" style={{ alignItems: "flex-start", gap: 24 }}>
          <div style={{ flex: 1, minWidth: 0 }}>
            {filtered.length === 0 ? (
              <Card><div className="sk-muted" style={{ textAlign: "center", padding: "24px 0" }}>Ничего не нашлось по заданным условиям.</div></Card>
            ) : (
              <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 16 }}>
                {filtered.map((v) => (
                  <VacancyCard key={v.id} vacancy={v} hasResponse={respondedIds.has(v.id)} matchPercent={DEMO_MATCH[v.id]} />
                ))}
              </div>
            )}
          </div>

          <FiltersPanel filters={filters} onChange={setFilters} hasActiveFilters={hasActiveFilters} onReset={() => setFilters(emptyFilters)}
            directionOptions={toOptions(D.directions)} positionOptions={positionOptions} departmentOptions={departmentOptions}
            subscriptions={subscriptions} onSubscribe={subscribe} onUnsubscribe={unsubscribe} />
        </div>
      </div>
      {toast && (
        <div style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", zIndex: 100 }}>
          <Snackbar>{toast}</Snackbar>
        </div>
      )}
    </AppShell>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
</script>
</body>
</html>
