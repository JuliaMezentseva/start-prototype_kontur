<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Отклики — Skillaz Start</title>
<link rel="stylesheet" href="../assets/styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../assets/ds_bundle.js"></script>
<script src="../assets/data.js"></script>
<script type="text/babel" src="../assets/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Card, Avatar, Divider, Button, Modal, Input, Table, SegmentedControl, Tag, Select } = window.SkillazCoreDesignSystem_bf9566;
const { AppShell, Icons } = window.Site;
const { IconArrowLeft, IconMapPin, IconBriefcase, IconPhone, IconMail, IconSearch, IconFileText, IconDownload } = Icons;
const D = window.SITE_DATA;

function vacancyIdFromUrl() {
  const id = new URLSearchParams(window.location.search).get("id");
  return D.vacancies.find((v) => v.id === id) ? id : D.vacancies[0].id;
}

// Резюме в этом контуре не хранится как настоящий файл — при скачивании собираем текстовый
// файл из тех же данных, что уже показаны в карточке отклика (см. exportResponsesCsv в
// hr/vacancies-manage.html — тот же паттерн генерации файла из мок-данных на клиенте).
function downloadResume(r) {
  const lines = [
    r.lastName + " " + r.firstName + " " + r.patronymic,
    r.position + (r.department ? " — " + r.department : ""),
    "Стаж в компании: " + r.tenure,
    "Город: " + r.city,
    "Телефон: " + r.phone,
    "Email: " + r.email,
    "",
    "Сопроводительное письмо:",
    r.letter || "—",
  ];
  const blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "Резюме_" + r.lastName + "_" + r.firstName + ".txt";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Стаж и дата — свободный текст ("2 года 3 месяца", "14.03.26"), для сортировки и
// фильтра по стажу разбираем их в сравнимые числа.
function parseTenureMonths(t) {
  const nums = ((t || "").match(/\d+/g) || []).map(Number);
  return (nums[0] || 0) * 12 + (nums[1] || 0);
}
function tenureBucket(t) {
  const m = parseTenureMonths(t);
  if (m < 12) return "lt1";
  if (m < 36) return "1to3";
  return "gt3";
}
const TENURE_BUCKET_LABELS = { lt1: "До 1 года", "1to3": "От 1 до 3 лет", gt3: "Более 3 лет" };
function parseDate(d) {
  const m = /^(\d{2})\.(\d{2})\.(\d{2})$/.exec(d || "");
  return m ? Number(m[3]) * 10000 + Number(m[2]) * 100 + Number(m[1]) : 0;
}

function DetailRow({ label, value }) {
  return (
    <div className="sk-row" style={{ justifyContent: "space-between", padding: "6px 0" }}>
      <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{label}</span>
      <span className="sk-label-4">{value}</span>
    </div>
  );
}

// Карточка "файла" резюме — в контуре нет настоящего загруженного файла, поэтому вместо
// пиктограммы конкретного формата показываем нейтральную карточку документа с кнопкой
// скачивания сгенерированного на лету текстового слепка тех же данных (см. downloadResume).
function ResumeCard({ r }) {
  return (
    <div className="sk-row sk-gap-3" style={{
      alignItems: "center", padding: "12px 14px", borderRadius: "var(--sk-radius-3)",
      background: "var(--sk-surface-secondary)",
    }}>
      <div style={{
        width: 36, height: 36, borderRadius: "var(--sk-radius-2)", flexShrink: 0,
        display: "flex", alignItems: "center", justifyContent: "center", background: "var(--sk-surface-tertiary)",
      }}>
        <IconFileText size={18} color="var(--sk-icon-secondary)" />
      </div>
      <div className="sk-col" style={{ flex: 1, gap: 0, minWidth: 0 }}>
        <div className="sk-label-4">Резюме_{r.lastName}_{r.firstName}</div>
        <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>Собрано из данных отклика</div>
      </div>
      <Button mode="secondary" size="s" icon={<IconDownload size={15} />} onClick={() => downloadResume(r)}>Скачать</Button>
    </div>
  );
}

// Карточка отклика — альтернатива табличному виду: то же самое одно нажатие открывает
// ту же ResponseDetailModal, но здесь сразу видно начало сопроводительного письма —
// удобнее, когда откликов немного и хочется быстро пробежать глазами по мотивации,
// а не сравнивать сухие поля по колонкам (для этого лучше подходит таблица).
function ResponseCard({ r, onOpen }) {
  const [hovered, setHovered] = React.useState(false);
  const fio = r.lastName + " " + r.firstName + " " + r.patronymic;
  return (
    <Card bordered onClick={onOpen} onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)} style={{
      cursor: "pointer", height: "100%",
      boxShadow: hovered ? "inset 0 0 0 1.5px var(--sk-stroke-accent)" : "inset 0 0 0 1px var(--sk-stroke)",
    }}>
      <div className="sk-col sk-gap-3" style={{ height: "100%" }}>
        <div className="sk-row sk-gap-2" style={{ alignItems: "center" }}>
          <Avatar name={fio} size={36} />
          <div className="sk-col" style={{ gap: 0, minWidth: 0 }}>
            <div className="sk-label-3" style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{fio}</div>
            <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.position}</div>
          </div>
        </div>

        <div className="sk-row sk-gap-2 sk-muted" style={{ font: "var(--sk-label-4-regular)", flexWrap: "wrap" }}>
          <span className="sk-row sk-gap-1"><IconMapPin size={13} />{r.city}</span>
          <span className="sk-row sk-gap-1"><IconBriefcase size={13} />{r.department}</span>
        </div>

        <div className="sk-label-4-regular" style={{
          flex: 1, color: "var(--sk-text-secondary)",
          display: "-webkit-box", WebkitLineClamp: 3, WebkitBoxOrient: "vertical", overflow: "hidden",
        }}>
          {r.letter || "Кандидат не оставил сопроводительное письмо."}
        </div>

        <div className="sk-row" style={{ justifyContent: "space-between", alignItems: "center" }}>
          <Tag size="s" hue="gray">{r.tenure}</Tag>
          <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{r.date}</span>
        </div>
      </div>
    </Card>
  );
}

function ResponseDetailModal({ r, onClose }) {
  const fio = r.lastName + " " + r.firstName + " " + r.patronymic;
  return (
    <Modal open title={fio} onClose={onClose} size="m"
      secondary={<Button mode="secondary" onClick={onClose}>Закрыть</Button>}>
      <div className="sk-col sk-gap-4">
        <div className="sk-row sk-gap-3" style={{ alignItems: "center" }}>
          <Avatar name={fio} size={44} />
          <div className="sk-col" style={{ gap: 0 }}>
            <div className="sk-label-2">{r.position}</div>
            <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{r.department}</div>
          </div>
        </div>

        <Card bordered>
          <DetailRow label="Стаж в компании" value={r.tenure} />
          <Divider />
          <DetailRow label="Город" value={r.city} />
          <Divider />
          <DetailRow label="Дата отклика" value={r.date} />
          <Divider />
          <div className="sk-row sk-gap-2" style={{ justifyContent: "space-between", padding: "6px 0", alignItems: "center" }}>
            <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}><IconPhone size={13} style={{ verticalAlign: -2, marginRight: 4 }} />Телефон</span>
            <span className="sk-label-4">{r.phone}</span>
          </div>
          <Divider />
          <div className="sk-row sk-gap-2" style={{ justifyContent: "space-between", padding: "6px 0", alignItems: "center" }}>
            <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}><IconMail size={13} style={{ verticalAlign: -2, marginRight: 4 }} />Почта</span>
            <span className="sk-label-4">{r.email}</span>
          </div>
        </Card>

        <div className="sk-col sk-gap-2">
          <div className="sk-label-4" style={{ color: "var(--sk-text-tertiary)", textTransform: "uppercase" }}>Сопроводительное письмо</div>
          <div className="sk-label-3-regular" style={{ whiteSpace: "pre-wrap" }}>{r.letter || "Кандидат не оставил сопроводительное письмо."}</div>
        </div>

        <div className="sk-col sk-gap-2">
          <div className="sk-label-4" style={{ color: "var(--sk-text-tertiary)", textTransform: "uppercase" }}>Резюме</div>
          <ResumeCard r={r} />
        </div>
      </div>
    </Modal>
  );
}

function Page() {
  const vacancy = D.vacancies.find((v) => v.id === vacancyIdFromUrl());
  const responses = vacancy.responses || [];
  const [q, setQ] = React.useState("");
  const [openIndex, setOpenIndex] = React.useState(null);
  // Таблица — вид по умолчанию: та же логика, что и в остальных HR-разделах (Планы
  // сотрудников, Управление вакансиями) — плотное сравнение полей по колонкам, привычнее
  // для перебора большого числа откликов. Карточки — альтернатива, когда откликов немного
  // и важнее сразу видеть начало сопроводительного письма.
  const [view, setView] = React.useState("table"); // "table" | "cards"
  const [filtersOpen, setFiltersOpen] = React.useState(false);
  const [filters, setFilters] = React.useState({ city: "", department: "", tenure: "" });
  const [sortBy, setSortBy] = React.useState(null); // null | { key, dir: "asc" | "desc" }

  const cityOptions = React.useMemo(() => [...new Set(responses.map((r) => r.city))].sort(), [responses]);
  const departmentOptions = React.useMemo(() => [...new Set(responses.map((r) => r.department))].sort(), [responses]);
  const hasActiveFilters = !!(filters.city || filters.department || filters.tenure);
  const activeFilterCount = [filters.city, filters.department, filters.tenure].filter(Boolean).length;

  const needle = q.trim().toLowerCase();
  const filtered = React.useMemo(() => {
    let list = responses;
    if (needle) {
      list = list.filter((r) =>
        (r.lastName + " " + r.firstName).toLowerCase().includes(needle) || r.position.toLowerCase().includes(needle));
    }
    if (filters.city) list = list.filter((r) => r.city === filters.city);
    if (filters.department) list = list.filter((r) => r.department === filters.department);
    if (filters.tenure) list = list.filter((r) => tenureBucket(r.tenure) === filters.tenure);
    if (sortBy) {
      const dir = sortBy.dir === "asc" ? 1 : -1;
      list = [...list].sort((a, b) => {
        let av, bv;
        if (sortBy.key === "name") { av = a.lastName + a.firstName; bv = b.lastName + b.firstName; }
        else if (sortBy.key === "tenure") { av = parseTenureMonths(a.tenure); bv = parseTenureMonths(b.tenure); }
        else if (sortBy.key === "city") { av = a.city; bv = b.city; }
        else if (sortBy.key === "date") { av = parseDate(a.date); bv = parseDate(b.date); }
        if (typeof av === "number" && typeof bv === "number") return (av - bv) * dir;
        return String(av).localeCompare(String(bv), "ru") * dir;
      });
    }
    return list;
  }, [responses, needle, filters, sortBy]);

  function toggleSort(key) {
    setSortBy((s) => {
      if (!s || s.key !== key) return { key, dir: "asc" };
      if (s.dir === "asc") return { key, dir: "desc" };
      return null;
    });
  }
  function SortableHeader({ label, sortKey }) {
    const active = sortBy && sortBy.key === sortKey;
    return (
      <button type="button" onClick={() => toggleSort(sortKey)} className="sk-row sk-gap-1 sk-clickable"
        style={{ background: "none", border: "none", padding: 0, font: "inherit", color: active ? "var(--sk-text-primary)" : "inherit", cursor: "pointer", alignItems: "center" }}>
        {label}
        <span style={{ display: "inline-flex", flexDirection: "column", lineHeight: 0, opacity: active ? 1 : 0.35 }}>
          <Icons.IconChevronUp size={11} style={{ marginBottom: -2, color: active && sortBy.dir === "asc" ? "var(--sk-text-accent)" : "currentColor" }} />
          <Icons.IconChevronDown size={11} style={{ color: active && sortBy.dir === "desc" ? "var(--sk-text-accent)" : "currentColor" }} />
        </span>
      </button>
    );
  }

  const columns = [
    { key: "name", title: <SortableHeader label="Кандидат" sortKey="name" />, render: (r) => (
      <div className="sk-row sk-gap-2" style={{ alignItems: "center" }}>
        <Avatar name={r.lastName + " " + r.firstName} size={32} />
        <span className="sk-label-3">{r.lastName} {r.firstName} {r.patronymic}</span>
      </div>
    ) },
    { key: "role", title: "Текущая роль", render: (r) => (
      <div className="sk-col" style={{ gap: 0 }}>
        <span className="sk-label-3-regular">{r.position}</span>
        <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{r.department}</span>
      </div>
    ) },
    { key: "tenure", title: <SortableHeader label="Стаж" sortKey="tenure" />, render: (r) => <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{r.tenure}</span> },
    { key: "city", title: <SortableHeader label="Город" sortKey="city" />, render: (r) => <span className="sk-label-3-regular">{r.city}</span> },
    { key: "letter", title: "Сопроводительное письмо", width: 280, render: (r) => (
      r.letter ? (
        <div className="sk-label-4-regular" style={{
          color: "var(--sk-text-secondary)", display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden",
        }}>{r.letter}</div>
      ) : (
        <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>—</span>
      )
    ) },
    { key: "date", title: <SortableHeader label="Дата отклика" sortKey="date" />, render: (r) => <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{r.date}</span> },
    { key: "resume", title: "Резюме", width: 110, render: (r) => (
      <Button mode="tertiary" size="s" icon={<IconDownload size={15} />} onClick={(e) => { e.stopPropagation(); downloadResume(r); }}>Скачать</Button>
    ) },
  ];

  return (
    <AppShell role="hr" active="vacancies" base=".."
      breadcrumb={<a href={"vacancy.html?id=" + vacancy.id} className="sk-row sk-gap-1" style={{ color: "var(--sk-text-secondary)" }}><IconArrowLeft size={14} /> Вакансия</a>}>
      <div className="sk-col sk-gap-1">
        <div className="sk-title-4">Отклики</div>
        <div className="sk-row sk-gap-2 sk-muted" style={{ alignItems: "center", flexWrap: "wrap" }}>
          <span className="sk-label-3" style={{ color: "var(--sk-text-primary)" }}>{vacancy.title}</span>
          <span>·</span>
          <span className="sk-row sk-gap-1"><IconMapPin size={13} />{vacancy.city}</span>
          <span className="sk-row sk-gap-1"><IconBriefcase size={13} />{vacancy.department}</span>
        </div>
      </div>

      <div className="sk-row sk-gap-2" style={{ alignItems: "center", flexWrap: "wrap" }}>
        <Input size="s" icon={<IconSearch size={20} />} placeholder="Поиск по имени или должности"
          value={q} onChange={(e) => setQ(e.target.value || "")} style={{ maxWidth: 360, flex: 1 }} />
        <Button mode="secondary" icon={<Icons.IconFilter size={16} />} onClick={() => setFiltersOpen((o) => !o)}
          style={{ background: "var(--sk-surface-page)", border: "1px solid var(--sk-stroke)" }}>
          Фильтры{hasActiveFilters ? " · " + activeFilterCount : ""}
        </Button>
        <SegmentedControl size="s" active={view} onChange={setView}
          items={[{ id: "table", label: "Таблица" }, { id: "cards", label: "Карточки" }]} />
      </div>

      {filtersOpen && (
        <Card bordered>
          <div className="sk-row sk-gap-3" style={{ flexWrap: "wrap", alignItems: "flex-end" }}>
            <Select label="Город" value={filters.city} placeholder="Любой город"
              options={cityOptions.map((c) => ({ value: c, label: c }))}
              onChange={(v) => setFilters((f) => ({ ...f, city: v }))} style={{ minWidth: 180 }} />
            <Select label="Подразделение" value={filters.department} placeholder="Любое подразделение"
              options={departmentOptions.map((d) => ({ value: d, label: d }))}
              onChange={(v) => setFilters((f) => ({ ...f, department: v }))} style={{ minWidth: 220 }} />
            <Select label="Стаж в компании" value={filters.tenure} placeholder="Любой стаж"
              options={Object.entries(TENURE_BUCKET_LABELS).map(([value, label]) => ({ value, label }))}
              onChange={(v) => setFilters((f) => ({ ...f, tenure: v }))} style={{ minWidth: 180 }} />
            {hasActiveFilters && (
              <Button mode="tertiary" onClick={() => setFilters({ city: "", department: "", tenure: "" })}>Сбросить</Button>
            )}
          </div>
        </Card>
      )}

      <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>Найдено откликов: {filtered.length}</div>

      {filtered.length === 0 ? (
        <Card><div className="sk-muted" style={{ textAlign: "center", padding: "24px 0" }}>
          {responses.length === 0 ? "Пока нет откликов на эту вакансию." : "Ничего не нашлось по заданным условиям."}
        </div></Card>
      ) : view === "table" ? (
        <div className="sk-scroll" style={{ overflowX: "auto" }}>
          <Table columns={columns} rows={filtered.map((r, i) => ({ ...r, id: i }))}
            onRowClick={(r) => setOpenIndex(r.id)} />
        </div>
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))", gap: 16 }}>
          {filtered.map((r, i) => (
            <ResponseCard key={i} r={r} onOpen={() => setOpenIndex(i)} />
          ))}
        </div>
      )}

      {openIndex != null && filtered[openIndex] && (
        <ResponseDetailModal r={filtered[openIndex]} onClose={() => setOpenIndex(null)} />
      )}
    </AppShell>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
</script>
</body>
</html>
