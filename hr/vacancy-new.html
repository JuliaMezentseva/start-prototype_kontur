<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Новая вакансия — Skillaz Start</title>
<link rel="stylesheet" href="../assets/styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../assets/ds_bundle.js"></script>
<script src="../assets/data.js"></script>
<script type="text/babel" src="../assets/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Card, Tag, Divider, Avatar, Input, Select, Textarea, Button, Switch, Snackbar } = window.SkillazCoreDesignSystem_bf9566;
const { AppShell, Icons } = window.Site;
const { IconArrowLeft, IconChevronDown } = Icons;
const D = window.SITE_DATA;

const SECTIONS = [
  { key: "basic", label: "Основное" },
  { key: "description", label: "Описание" },
  { key: "params", label: "Параметры" },
  { key: "publish", label: "Публикация и команда" },
];

// Поле навыков — теги с крестиком-удалением (Tag.onRemove уже есть в ДС) плюс
// текстовое поле в том же контуре: Enter/запятая добавляют тег, как на большинстве
// джоббордов, без отдельной кнопки "Добавить".
function SkillTagInput({ value, onChange }) {
  const [draft, setDraft] = React.useState("");
  function commit() {
    const v = draft.trim();
    if (v && !value.includes(v)) onChange([...value, v]);
    setDraft("");
  }
  return (
    <div className="sk-row sk-gap-2" style={{
      flexWrap: "wrap", alignItems: "center", minHeight: 48, padding: "8px 10px",
      boxShadow: "inset 0 0 0 1px var(--sk-stroke)", borderRadius: "var(--sk-radius-form)", background: "var(--sk-surface-page)",
    }}>
      {value.map((s) => (
        <Tag key={s} size="s" pill onRemove={() => onChange(value.filter((x) => x !== s))}>{s}</Tag>
      ))}
      <input value={draft} onChange={(e) => setDraft(e.target.value)}
        onKeyDown={(e) => { if (e.key === "Enter" || e.key === "Return" || e.key === ",") { e.preventDefault(); commit(); } }}
        onBlur={commit} placeholder="Добавить навык…" style={{
          flex: 1, minWidth: 140, border: "none", outline: "none", background: "transparent",
          font: "400 14px/20px var(--sk-font-ui)", color: "var(--sk-text-primary)",
        }} />
    </div>
  );
}

// Пикер рекрутёра-контакта — тот же паттерн клика-вне-закрывает, что и у FilterChip/Select
// в других формах прототипа; список вариантов собран из уже существующих рекрутёров вакансий,
// отдельного справочника рекрутёров в данных прототипа нет.
function RecruiterPicker({ value, options, onChange }) {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!open) return;
    const close = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", close);
    return () => document.removeEventListener("mousedown", close);
  }, [open]);
  return (
    <div ref={ref} style={{ position: "relative" }}>
      <button type="button" onClick={() => setOpen((o) => !o)} className="sk-row sk-gap-3 sk-clickable" style={{
        alignItems: "center", width: "100%", padding: "10px 12px", cursor: "pointer",
        boxShadow: `inset 0 0 0 1px ${open ? "var(--sk-stroke-accent)" : "var(--sk-stroke)"}`,
        borderRadius: "var(--sk-radius-form)", background: "var(--sk-surface-page)", border: "none",
      }}>
        <Avatar name={value.name} size={36} />
        <div className="sk-col" style={{ flex: 1, gap: 0, textAlign: "left" }}>
          <div className="sk-label-3">{value.name}</div>
          <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{value.role}</div>
        </div>
        <IconChevronDown size={16} style={{ opacity: 0.55, transform: open ? "rotate(180deg)" : "none", transition: "transform var(--sk-duration) var(--sk-ease)" }} />
      </button>
      {open && (
        <div style={{
          position: "absolute", top: "calc(100% + 4px)", left: 0, right: 0, zIndex: 20, maxHeight: 260, overflowY: "auto",
          background: "var(--sk-surface-page)", borderRadius: "var(--sk-radius-2)", boxShadow: "var(--sk-shadow-m)", padding: 6,
        }}>
          {options.map((o) => (
            <button key={o.email} type="button" onClick={() => { onChange(o); setOpen(false); }} className="sk-row sk-gap-3 sk-clickable" style={{
              width: "100%", padding: "8px 10px", border: "none", cursor: "pointer", alignItems: "center", textAlign: "left",
              borderRadius: "var(--sk-radius-2)", background: o.email === value.email ? "var(--sk-surface-secondary)" : "transparent",
            }}>
              <Avatar name={o.name} size={28} />
              <div className="sk-col" style={{ gap: 0 }}>
                <div className="sk-label-4">{o.name}</div>
                <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{o.role}</div>
              </div>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function Page() {
  const recruiterOptions = React.useMemo(() => {
    const map = new Map();
    D.vacancies.forEach((v) => { if (v.recruiter && !map.has(v.recruiter.email)) map.set(v.recruiter.email, v.recruiter); });
    return [...map.values()];
  }, []);

  const [form, setForm] = React.useState({
    title: "", direction: D.directions[0], department: "", skills: [],
    responsibilities: "", requirements: "", conditions: "",
    city: D.cities[0], format: D.workFormats[0], employment: D.employmentTypes[0],
    grade: "", experience: D.experienceOptions[0], salaryFrom: "", salaryTo: "",
    visibleToEmployees: true, recruiter: recruiterOptions[0],
  });
  const set = (k) => (v) => setForm((f) => ({ ...f, [k]: v }));
  const [toast, setToast] = React.useState(null);
  const [activeSection, setActiveSection] = React.useState("basic");
  const sectionRefs = { basic: React.useRef(), description: React.useRef(), params: React.useRef(), publish: React.useRef() };

  // Скроллспай по секциям формы: активный пункт справа подсвечивается по тому, какая
  // секция сейчас ближе всего к верху видимой области — так навигация справа отражает
  // реальную прокрутку, а не просто фиксируется на первом пункте.
  React.useEffect(() => {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) setActiveSection(e.target.dataset.section); });
    }, { rootMargin: "-15% 0px -70% 0px" });
    Object.values(sectionRefs).forEach((r) => r.current && io.observe(r.current));
    return () => io.disconnect();
  }, []);

  function scrollToSection(key) {
    sectionRefs[key].current && sectionRefs[key].current.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  const valid = form.title.trim() && form.department.trim() && form.responsibilities.trim()
    && form.requirements.trim() && form.salaryFrom && form.salaryTo;

  function showToast(msg) { setToast(msg); window.setTimeout(() => setToast(null), 2400); }
  function saveDraft() { showToast("Черновик сохранён"); }
  function publish() {
    showToast("Вакансия опубликована");
    window.setTimeout(() => { window.location.href = "vacancies.html"; }, 900);
  }

  return (
    <AppShell role="hr" active="vacancies" base=".."
      breadcrumb={<a href="vacancies.html" className="sk-row sk-gap-1" style={{ color: "var(--sk-text-secondary)" }}><IconArrowLeft size={14} /> Управление вакансиями</a>}>
      <div className="sk-row" style={{ justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 12 }}>
        <div className="sk-row sk-gap-2" style={{ alignItems: "center" }}>
          <div className="sk-title-4">Новая вакансия</div>
          <Tag size="s" hue="neutral">Черновик</Tag>
        </div>
        <div className="sk-row sk-gap-2">
          <Button mode="secondary" onClick={saveDraft}>Сохранить черновик</Button>
          <Button variant="accent" disabled={!valid} onClick={publish}>Опубликовать вакансию</Button>
        </div>
      </div>

      <div className="sk-row" style={{ alignItems: "flex-start", gap: 32 }}>
        <div className="sk-col sk-gap-6" style={{ flex: 1, minWidth: 0, maxWidth: 720 }}>

          <div ref={sectionRefs.basic} data-section="basic" className="sk-col sk-gap-3">
            <div className="sk-label-2">Основное</div>
            <Input label="Название вакансии" required placeholder="Например, Senior Frontend-разработчик"
              value={form.title} onChange={(e) => set("title")(e.target.value || "")} />
            <div className="sk-row sk-gap-3">
              <Select label="Направление" value={form.direction} options={D.directions.map((d) => ({ value: d, label: d }))}
                onChange={set("direction")} style={{ flex: 1 }} />
              <Input label="Подразделение" required value={form.department} onChange={(e) => set("department")(e.target.value || "")} style={{ flex: 1 }} />
            </div>
            <div className="sk-col sk-gap-2">
              <div className="sk-label-3">Ключевые навыки</div>
              <SkillTagInput value={form.skills} onChange={set("skills")} />
              <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>Показываются тегами в карточке вакансии</div>
            </div>
          </div>

          <Divider />

          <div ref={sectionRefs.description} data-section="description" className="sk-col sk-gap-3">
            <div className="sk-label-2">Описание</div>
            <Textarea label="Обязанности" required helper="Каждый пункт — с новой строки" rows={4}
              value={form.responsibilities} onChange={(e) => set("responsibilities")(e.target.value || "")} />
            <Textarea label="Требования и навыки" required helper="Каждый пункт — с новой строки" rows={4}
              value={form.requirements} onChange={(e) => set("requirements")(e.target.value || "")} />
            <Textarea label="Условия" helper="Каждый пункт — с новой строки" rows={3}
              value={form.conditions} onChange={(e) => set("conditions")(e.target.value || "")} />
          </div>

          <Divider />

          <div ref={sectionRefs.params} data-section="params" className="sk-col sk-gap-3">
            <div className="sk-label-2">Параметры</div>
            <div className="sk-row sk-gap-3">
              <Select label="Город" value={form.city} options={D.cities.map((c) => ({ value: c, label: c }))} onChange={set("city")} style={{ flex: 1 }} />
              <Select label="Формат работы" value={form.format} options={D.workFormats.map((f) => ({ value: f, label: f }))} onChange={set("format")} style={{ flex: 1 }} />
              <Select label="Тип занятости" value={form.employment} options={D.employmentTypes.map((e) => ({ value: e, label: e }))} onChange={set("employment")} style={{ flex: 1 }} />
            </div>
            <div className="sk-row sk-gap-3">
              <Input label="Грейд" placeholder="Junior / Middle / Senior" value={form.grade} onChange={(e) => set("grade")(e.target.value || "")} style={{ flex: 1 }} />
              <Select label="Опыт" value={form.experience} options={D.experienceOptions.map((e) => ({ value: e, label: e }))} onChange={set("experience")} style={{ flex: 1 }} />
              <Input label="Оклад от" required type="number" value={form.salaryFrom} onChange={(e) => set("salaryFrom")(e.target.value)} style={{ flex: 1 }} />
              <Input label="Оклад до" required type="number" value={form.salaryTo} onChange={(e) => set("salaryTo")(e.target.value)} style={{ flex: 1 }} />
            </div>
            <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>на руки, до вычета налогов</div>
          </div>

          <Divider />

          <div ref={sectionRefs.publish} data-section="publish" className="sk-col sk-gap-4">
            <div className="sk-label-2">Публикация и команда</div>
            <div className="sk-row sk-gap-3" style={{ alignItems: "center" }}>
              <Switch checked={form.visibleToEmployees} onChange={set("visibleToEmployees")} />
              <div className="sk-col" style={{ gap: 0 }}>
                <div className="sk-label-3-regular">Видна сотрудникам</div>
                <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>Появится на витрине сразу после публикации</div>
              </div>
            </div>
            <div className="sk-col sk-gap-2">
              <div className="sk-label-3">Контакт для связи</div>
              <RecruiterPicker value={form.recruiter} options={recruiterOptions} onChange={set("recruiter")} />
            </div>
          </div>

        </div>

        <div style={{ width: 220, flexShrink: 0, position: "sticky", top: 24 }}>
          <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)", textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 12 }}>
            На этой странице
          </div>
          <div className="sk-col sk-gap-1">
            {SECTIONS.map((s) => (
              <button key={s.key} type="button" onClick={() => scrollToSection(s.key)} className="sk-clickable" style={{
                textAlign: "left", padding: "6px 0", border: "none", background: "none", cursor: "pointer",
                font: activeSection === s.key ? "var(--sk-label-3)" : "var(--sk-label-3-regular)",
                color: activeSection === s.key ? "var(--sk-text-accent)" : "var(--sk-text-secondary)",
              }}>
                {s.label}
              </button>
            ))}
          </div>
          <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)", marginTop: 16 }}>Черновик сохраняется автоматически</div>
        </div>
      </div>

      {toast && (
        <div style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", zIndex: 100 }}>
          <Snackbar>{toast}</Snackbar>
        </div>
      )}
    </AppShell>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
</script>
</body>
</html>
