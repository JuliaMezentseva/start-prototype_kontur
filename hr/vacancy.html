<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Вакансия — Skillaz Start</title>
<link rel="stylesheet" href="../assets/styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../assets/ds_bundle.js"></script>
<script src="../assets/data.js"></script>
<script type="text/babel" src="../assets/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Card, Tag, TextList, Divider, Avatar, Button, Checkbox, Modal } = window.SkillazCoreDesignSystem_bf9566;
const { AppShell, Icons } = window.Site;
const { IconArrowLeft, IconMapPin, IconMail, IconPhone, IconTarget, IconCheck, IconGift, IconLayers, IconClock, IconBriefcase, IconSparklesSolid } = Icons;
const D = window.SITE_DATA;

function fmtMoney(n) { return n.toLocaleString("ru-RU"); }
function vacancyIdFromUrl() {
  const id = new URLSearchParams(window.location.search).get("id");
  return D.vacancies.find(v => v.id === id) ? id : D.vacancies[0].id;
}

function MatchTag({ percent }) {
  return (
    <Tag size="s" pill icon={<IconSparklesSolid size={12} />} style={{ background: "var(--sk-special-secondary)", color: "rgb(117,59,233)", flexShrink: 0 }}>
      Подходит на {percent}%
    </Tag>
  );
}

// Карточка "Подходящие сотрудники": по клику "Почему подходит" разворачивается список причин
// совпадения (см. matchReasons в данных вакансии), чекбоксы слева включают режим сравнения —
// при выборе двух и более открывается модалка с карточками кандидатов рядом.
function MatchingEmployeesCard({ employees }) {
  const [expanded, setExpanded] = React.useState(null);
  const [selected, setSelected] = React.useState([]);
  const [compareOpen, setCompareOpen] = React.useState(false);
  function toggleSelect(i) { setSelected((s) => s.includes(i) ? s.filter((x) => x !== i) : [...s, i]); }

  return (
    <Card bordered>
      <div className="sk-col sk-gap-3">
        <div className="sk-row" style={{ justifyContent: "space-between", alignItems: "center" }}>
          <div className="sk-row sk-gap-2 sk-label-2"><IconSparklesSolid size={18} color="rgb(117,59,233)" />Подходящие сотрудники</div>
          {selected.length >= 2 && <Button size="s" mode="secondary" onClick={() => setCompareOpen(true)}>Сравнить · {selected.length}</Button>}
        </div>
        <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>
          Внутренние сотрудники, чей профиль и цели развития перекликаются с этой вакансией.
        </div>
        <div className="sk-col">
          {employees.map((e, i) => (
            <div key={i} style={{ borderTop: i > 0 ? "1px solid var(--sk-stroke)" : "none" }}>
              <div className="sk-row sk-gap-3" style={{ alignItems: "center", padding: "12px 0" }}>
                <Checkbox checked={selected.includes(i)} onChange={() => toggleSelect(i)} />
                <Avatar name={e.name} size={36} />
                <div className="sk-col" style={{ flex: 1, gap: 0, minWidth: 0 }}>
                  <div className="sk-label-3">{e.name}</div>
                  <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{e.position} · {e.department}</div>
                </div>
                <MatchTag percent={e.matchPercent} />
                {e.matchReasons && e.matchReasons.length > 0 && (
                  <Button size="s" mode="tertiary" onClick={() => setExpanded(expanded === i ? null : i)} style={{ flexShrink: 0 }}>
                    {expanded === i ? "Скрыть" : "Почему подходит"}
                  </Button>
                )}
              </div>
              {expanded === i && (
                <div style={{ padding: "0 0 14px 48px" }}>
                  <TextList size="s" items={e.matchReasons} />
                </div>
              )}
            </div>
          ))}
        </div>
      </div>

      {compareOpen && (
        <Modal open title="Сравнение кандидатов" onClose={() => setCompareOpen(false)} size="l"
          secondary={<Button mode="secondary" onClick={() => setCompareOpen(false)}>Закрыть</Button>}>
          <div className="sk-row sk-gap-4" style={{ alignItems: "flex-start" }}>
            {selected.map((i) => {
              const e = employees[i];
              return (
                <div key={i} className="sk-col sk-gap-2" style={{ flex: 1, minWidth: 0 }}>
                  <div className="sk-row sk-gap-2" style={{ alignItems: "center" }}>
                    <Avatar name={e.name} size={32} />
                    <div className="sk-label-3">{e.name}</div>
                  </div>
                  <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{e.position} · {e.department}</div>
                  <MatchTag percent={e.matchPercent} />
                  <Divider />
                  <TextList size="s" items={e.matchReasons || []} />
                </div>
              );
            })}
          </div>
        </Modal>
      )}
    </Card>
  );
}

function DetailRow({ label, value }) {
  return (
    <div className="sk-row" style={{ justifyContent: "space-between", padding: "6px 0" }}>
      <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{label}</span>
      <span className="sk-label-4">{value}</span>
    </div>
  );
}

function Page() {
  const vacancy = D.vacancies.find(v => v.id === vacancyIdFromUrl());
  const closed = vacancy.status === "closed";

  return (
    <AppShell role="hr" active="vacancies" base=".."
      breadcrumb={<a href="vacancies.html" className="sk-row sk-gap-1" style={{ color: "var(--sk-text-secondary)" }}><IconArrowLeft size={14} /> Вакансии</a>}>
      <div className="sk-row" style={{ justifyContent: "space-between", alignItems: "flex-start" }}>
        <div className="sk-col sk-gap-3" style={{ flex: 1 }}>
          <div className="sk-row sk-gap-2" style={{ flexWrap: "wrap", alignItems: "center" }}>
            <Tag size="s" hue="gray">{vacancy.transitionType}</Tag>
            {closed
              ? <Tag size="s" hue="neutral">Закрыта</Tag>
              : <Tag size="s" hue="positive" icon={<IconCheck size={12} />}>Идёт поиск</Tag>}
          </div>
          <div className="sk-title-4">{vacancy.title}</div>
          <div className="sk-row sk-gap-4 sk-muted" style={{ flexWrap: "wrap" }}>
            <span className="sk-row sk-gap-1"><IconMapPin size={15} />{vacancy.city} · {vacancy.format}</span>
            <span className="sk-row sk-gap-1"><IconBriefcase size={15} />{vacancy.department}</span>
            {!closed && <span className="sk-row sk-gap-1"><IconClock size={15} />{vacancy.postedDate}</span>}
          </div>
        </div>
      </div>

      <div className="sk-row" style={{ alignItems: "flex-start", gap: 24 }}>
        <div className="sk-col sk-gap-5" style={{ flex: 1, minWidth: 0 }}>
          <Card bordered>
            <div className="sk-col sk-gap-3">
              <div className="sk-row sk-gap-2 sk-label-2"><IconTarget size={18} color="var(--sk-icon-accent)" />Чем предстоит заниматься</div>
              <TextList items={vacancy.responsibilities} />
            </div>
          </Card>
          <Card bordered>
            <div className="sk-col sk-gap-3">
              <div className="sk-row sk-gap-2 sk-label-2"><IconCheck size={18} color="var(--sk-icon-accent)" />Требования</div>
              <TextList items={vacancy.requirements} />
            </div>
          </Card>
          <Card bordered>
            <div className="sk-col sk-gap-3">
              <div className="sk-row sk-gap-2 sk-label-2"><IconGift size={18} color="var(--sk-icon-accent)" />Условия</div>
              <TextList items={vacancy.conditions} />
            </div>
          </Card>
          <Card bordered>
            <div className="sk-col sk-gap-3">
              <div className="sk-row sk-gap-2 sk-label-2"><IconLayers size={18} color="var(--sk-icon-accent)" />Ключевые навыки</div>
              <div className="sk-row sk-gap-2" style={{ flexWrap: "wrap" }}>
                {vacancy.requiredSkills.map((s, i) => <Tag key={i} size="s" hue="gray" pill>{s}</Tag>)}
              </div>
            </div>
          </Card>

          {vacancy.matchingEmployees && vacancy.matchingEmployees.length > 0 && (
            <MatchingEmployeesCard employees={vacancy.matchingEmployees} />
          )}
        </div>

        <div style={{ width: 300, flexShrink: 0 }}>
          <Card bordered>
            <div className="sk-col sk-gap-4">
              <div style={{ background: "var(--sk-accent-secondary)", borderRadius: "var(--sk-radius-3)", padding: "14px 16px" }}>
                {vacancy.salaryFrom && vacancy.salaryTo ? (
                  <div className="sk-title-5" style={{ color: "var(--sk-text-accent)" }}>{fmtMoney(vacancy.salaryFrom)} – {fmtMoney(vacancy.salaryTo)} ₽</div>
                ) : (
                  <div className="sk-title-5" style={{ color: "var(--sk-text-accent)" }}>По договорённости</div>
                )}
              </div>

              <div className="sk-col">
                <DetailRow label="Регион" value={vacancy.city} />
                <Divider />
                <DetailRow label="Опыт работы" value={vacancy.experience} />
                <Divider />
                <DetailRow label="Тип занятости" value={vacancy.employment} />
                <Divider />
                <DetailRow label="Формат" value={vacancy.format} />
                <Divider />
                <DetailRow label="Подразделение" value={vacancy.department} />
                <Divider />
                <DetailRow label="Грейд" value={vacancy.grade} />
              </div>

              <Divider />

              <div className="sk-col sk-gap-2">
                <div className="sk-label-4" style={{ color: "var(--sk-text-tertiary)", textTransform: "uppercase" }}>Рекрутёр вакансии</div>
                <div className="sk-row sk-gap-3">
                  <Avatar name={vacancy.recruiter.name} size={36} />
                  <div className="sk-col" style={{ gap: 0 }}>
                    <div className="sk-label-3">{vacancy.recruiter.name}</div>
                    <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{vacancy.recruiter.role}</div>
                  </div>
                </div>
                <div className="sk-col sk-gap-1" style={{ paddingLeft: 48 }}>
                  <div className="sk-row sk-gap-2 sk-muted" style={{ font: "var(--sk-label-4-regular)" }}><IconPhone size={13} />{vacancy.recruiter.phone}</div>
                  <div className="sk-row sk-gap-2 sk-muted" style={{ font: "var(--sk-label-4-regular)" }}><IconMail size={13} />{vacancy.recruiter.email}</div>
                </div>
              </div>
            </div>
          </Card>
        </div>
      </div>
    </AppShell>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
</script>
</body>
</html>
